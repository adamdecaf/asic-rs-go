name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asic-rs-ffi -> target

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build FFI bridge
        run: make ffi

      - name: Compile Go package
        env:
          CGO_ENABLED: "1"
        run: go build ./asicrs/

      - name: Compile examples
        env:
          CGO_ENABLED: "1"
        run: go build ./examples/get_data ./examples/scan

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test ./asicrs/ -count=1
