[package]
name = "asic-rs-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C ABI FFI bridge for asic-rs, used by asic-rs-go"
publish = false

[lib]
name = "asic_rs_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
asic-rs = { version = "0.7.2", default-features = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
measurements = "0.11"

[build-dependencies]
cbindgen = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
